#
# Build GMT and run a few simple tests
#
name: Build

on:
  push:
    branches:
      - master
      - 6.[0-9]+
    paths:
      - 'ci/**'
      - 'cmake/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'ci/**'
      - 'cmake/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

defaults:
  run:
    # default to use bash shell
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      # directories
      COASTLINEDIR: ${{ github.workspace }}/coastline
      INSTALLDIR: ${{ github.workspace }}/gmt-install-dir
      # disable auto-display of GMT plots
      GMT_END_SHOW: off
      # Compile only
      BUILD_DOCS  : false
      PACKAGE     : false
      RUN_TESTS   : false

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-15-intel
          - name: Windows
            os: windows-latest
          - name: Linux (without optional dependencies)
            os: ubuntu-latest
            EXCLUDE_OPTIONAL : true

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup vcpkg (Windows)
        run: gh run download -n vcpkg-cache -D C:/vcpkg/installed/
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup micromamba (macOS)
        uses: mamba-org/setup-micromamba@v3.2.1
        if: runner.os == 'macOS'

      - name: Install GMT dependencies
        run: |
          # $RUNNER_OS can be Linux, macOS or Windows
          # The following command converts $RUNNER_OS to lowercase
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          bash ci/install-dependencies-${os}.sh
        env:
          EXCLUDE_OPTIONAL: ${{ matrix.EXCLUDE_OPTIONAL }}

      - name: Download GSHHG and DCW data
        run: gh run download -n coastline-cache -D coastline
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure GMT
        run: bash ci/config-gmt.sh

      - name: Compile GMT (Linux/macOS)
        run: |
          mkdir build
          cd build
          cmake -G Ninja ..
          cmake --build .
        if: runner.os != 'Windows'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64

      - name: Compile GMT (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Install GMT
        run: |
          cd build
          cmake --build . --target install
          # Add GMT PATH to bin
          echo "${INSTALLDIR}/bin" >> $GITHUB_PATH

      - name: Download cached GMT remote data from GitHub Artifacts
        run: |
          gh run download -n gmt-cache -D ~/.gmt/static/
          # GMT reads these two index files at the root of ~/.gmt/static, but older
          # artifacts keep them in server/; a zero-byte one here disables all downloads.
          for f in gmt_data_server.txt gmt_hash_server.txt; do
            test -s ~/.gmt/static/$f || cp ~/.gmt/static/server/$f ~/.gmt/static/$f || exit 1
            touch ~/.gmt/static/$f
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check a few simple commands
        shell: bash
        run: bash ci/simple-gmt-tests.sh

      - name: Check a few simple commands (Windows)
        shell: cmd
        run: call ci/simple-gmt-tests.bat
        if: runner.os == 'Windows'
