#
# Build GMT source codes on different Linux distros using dockers.
#
# This workflow is triggered by push or pull request events.
#
name: Docker

on:
  push:
    branches:
      - master
      - 6.[0-9]+
    paths:
      - 'ci/**'
      - 'cmake/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'ci/**'
      - 'cmake/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  docker:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 30

    env:
      # directories
      COASTLINEDIR: ${{ github.workspace }}/coastline
      INSTALLDIR: ${{ github.workspace }}/gmt-install-dir
      # disable auto-display of GMT plots
      GMT_END_SHOW: off
      # Compile only. Used by ci/config-gmt-unix.sh
      RUN_TESTS: false

    strategy:
      fail-fast: false
      matrix:
        image:
          # Test the oldest and latest Ubuntu LTS releases and also unstable Debian/Fedora
          # Ubuntu: https://en.wikipedia.org/wiki/Ubuntu_version_history#Table_of_versions
          - ubuntu:22.04    # CMake 3.22.1 + GNU 11.2.0; EOL: 2027-06-01
          - ubuntu:26.04    # CMake 4.2.3 + GNU 15.2.0;  EOL: 2031-05-29
          - debian:sid      # rolling release with latest versions
          - fedora:rawhide  # rolling release with latest versions

    steps:
      - name: Install GMT dependencies
        run: |
          . /etc/os-release
          if [[ "$ID" = "ubuntu" || "$ID" = "debian" ]]; then
            apt-get update
            DEBIAN_FRONTEND="noninteractive" TZ="America/New_York" apt-get install -y tzdata
            apt-get install -y --no-install-recommends --no-install-suggests \
                 build-essential cmake ninja-build \
                 libcurl4-gnutls-dev libnetcdf-dev libgdal-dev \
                 libfftw3-dev libpcre2-dev liblapack-dev libglib2.0-dev \
                 ghostscript curl git
            apt reinstall -y ca-certificates
            update-ca-certificates
            # Install gh from binary deb package.
            curl -LO https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.deb
            apt install -y ./gh_2.100.0_linux_amd64.deb
          elif [[ "$ID" = "fedora" ]]; then
            dnf install -y --disablerepo=fedora-cisco-openh264 \
                gcc git cmake ninja-build \
                libcurl-devel netcdf-devel gdal-devel \
                fftw3-devel pcre2-devel lapack-devel openblas-devel glib2-devel \
                ghostscript gh
          fi

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Fixup git
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Download GSHHG and DCW data
        run: gh run download -n coastline-cache -D coastline
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure GMT
        run: bash ci/config-gmt-unix.sh

      - name: Compile and install GMT
        run: |
          mkdir build
          cd build
          cmake -G Ninja ..
          cmake --build .
          cmake --build . --target install
          # Add GMT PATH to bin
          echo "${INSTALLDIR}/bin" >> $GITHUB_PATH

      - name: Download cached GMT remote data from GitHub Artifacts
        run: |
          gh run download -n gmt-cache -D ~/.gmt/static/
          touch ~/.gmt/static/gmt_data_server.txt ~/.gmt/static/gmt_hash_server.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check a few simple commands
        run: bash ci/simple-gmt-tests.sh
