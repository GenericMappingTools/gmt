# Check links in plaintext files in the repository
#
# This workflow runs the lychee tool to check all links in plaintext files. It will
# create an issue if broken links are found.
#
# It is scheduled to run weekly at 12 noon every Sunday.
#
name: Check Links

on:
  # Uncomment the 'pull_request' line below to trigger the workflow in PR
  # pull_request:
  workflow_dispatch:
  # Schedule runs on 12 noon every Sunday
  schedule:
    - cron: '0 12 * * 0'

permissions:
  issues: write

jobs:
  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    if: github.repository == 'GenericMappingTools/gmt'

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6.0.2

    - name: Link Checker
      id: lychee
      uses: lycheeverse/lychee-action@v2.8.0
      with:
        fail: false  # Don't fail action on broken links
        output: /tmp/lychee-out.md
        # 200: OK
        # 429: Too many requests
        args: >
          --accept 200,429
          --exclude ^ftp://
          --exclude ^http://aa.usno.navy.mil/faq/docs/lawyers.php$
          --exclude ^http://maps.google.com/mapfiles/kml/$
          --exclude ^http://nsis.sourceforge.io
          --exclude ^http://topex.ucsd.edu
          --exclude ^http://topex.ucsd.edu/marine_grav/mar_grav.html
          --exclude ^http://www.eumetsat.int
          --exclude ^https://doi.org
          --exclude ^https://download1.rpmfusion.org/free/el/rpmfusion-free-release-$
          --exclude ^https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$
          --exclude ^https://linux.die.net/man/3/printf
          --exclude ^https://topex.ucsd.edu/sandwell/
          --exclude ^https://www.ethnologue.com
          --exclude ^https://www.researchgate.net/
          --exclude ^https://www.softpedia.com/get/Tweak/Registry-Tweak/EditPath.shtml
          --exclude ^http://my.server.com/images$
          **/*.rst
          **/*.rst_
          **/*.md

    - name: Remove duplicate links from the report
      if: steps.lychee.outputs.exit_code != 0
      shell: python3 {0}
      run: |
        import re
        from pathlib import Path

        report = Path("/tmp/lychee-out.md")
        lines = report.read_text().splitlines()

        # Each bullet line reports one link, e.g. "* [404] <https://example.com> (at ...)".
        # The same link is often referenced from many files, so lychee lists it once
        # per file. Keep only the first occurrence of each link.
        bullet_re = re.compile(r"^\* (?:\[[^\]]+\] )?<?([^\s>]+)>?")

        seen = set()
        deduped = []
        for line in lines:
            if line.startswith("* "):
                match = bullet_re.match(line)
                if match:
                    link = match.group(1)
                    if link in seen:
                        continue
                    seen.add(link)
            deduped.append(line)

        # Drop "### ... in <file>" subsections left with no links after deduplication.
        filtered = []
        i = 0
        while i < len(deduped):
            line = deduped[i]
            if line.startswith("### "):
                j = i + 1
                has_link = False
                while j < len(deduped) and not deduped[j].startswith("##"):
                    if deduped[j].startswith("* "):
                        has_link = True
                        break
                    j += 1
                if not has_link:
                    i = j
                    continue
            filtered.append(line)
            i += 1

        report.write_text("\n".join(filtered) + "\n")

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Create Issue From File
      if: github.event_name != 'workflow_dispatch' && steps.lychee.outputs.exit_code != 0
      run: |
        title="Link Checker Report on ${CURRENT_DATE}"
        gh issue create --title "$title" --body-file /tmp/lychee-out.md
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        CURRENT_DATE: ${{ steps.date.outputs.date }}
