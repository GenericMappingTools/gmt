#
# Run full tests
#
name: Tests

on:
  push:
    branches:
      - master
      - 6.[0-9]+
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # default to use bash shell
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-slim
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # paths-filter needs a checkout for push events; on PRs it uses the API
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'src/**'
              - 'test/**'
              - 'doc/examples/**'
              - 'doc/scripts/**'
              - '.github/workflows/tests.yml'

  test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    env:
      # directories
      COASTLINEDIR: ${{ github.workspace }}/coastline
      INSTALLDIR: ${{ github.workspace }}/gmt-install-dir
      # disable auto-display of GMT plots
      GMT_END_SHOW: off
      # Run full tests
      BUILD_DOCS  : false
      PACKAGE     : false
      RUN_TESTS   : true

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup vcpkg (Windows)
        run: gh run download -n vcpkg-cache -D C:/vcpkg/installed/
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        if: runner.os == 'macOS'

      - name: Install GMT dependencies
        run: |
          # $RUNNER_OS can be Linux, macOS or Windows
          # The following command converts $RUNNER_OS to lowercase
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          bash ci/install-dependencies-${os}.sh
        env:
          EXCLUDE_OPTIONAL: ${{ matrix.EXCLUDE_OPTIONAL }}

      - name: Add Ghostscript registry so that GraphicsMagick can find it [Windows]
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\Software\GPL Ghostscript"
          New-Item -Path "HKLM:\Software\GPL Ghostscript\10.03.0"
          New-ItemProperty -Path "HKLM:\Software\GPL Ghostscript\10.03.0" -Name GS_DLL -PropertyType String -Value "C:\Miniconda\Library\bin\gsdll64.dll"
          New-ItemProperty -Path "HKLM:\Software\GPL Ghostscript\10.03.0" -Name GS_LIB -PropertyType String -Value "C:\Miniconda\Library\bin;C:\Miniconda\Library\lib;C\Miniconda\Library\Font;C:\Miniconda\Library\fonts"
        if: runner.os == 'Windows'

      - name: Download GSHHG and DCW data
        run: gh run download -n coastline-cache -D coastline
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure GMT
        run: bash ci/config-gmt.sh

      - name: Compile GMT (Linux/macOS)
        run: |
          mkdir build
          cd build
          cmake -G Ninja ..
          cmake --build .
        if: runner.os != 'Windows'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64

      - name: Compile GMT (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DVCPKG_APPLOCAL_DEPS=OFF
          cmake --build .

      - name: Pull baseline image data from dvc remote
        id: dvc-pull
        continue-on-error: true
        run: |
          dvc remote modify origin url https://${DAGSHUB_TOKEN}@dagshub.com/GenericMappingTools/gmt.dvc --local
          dvc pull --remote origin --no-run-cache --force
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

      - name: Download DVC cache from GitHub Artifacts and restore baseline image data
        if: steps.dvc-pull.outcome == 'failure'
        run: |
          rm -rf .dvc/cache
          gh run download -n dvc-cache -D .dvc/cache/
          dvc checkout --force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install GMT
        run: |
          cd build
          cmake --build . --target install
          # Add GMT PATH to bin
          echo "${INSTALLDIR}/bin" >> $GITHUB_PATH

      - name: Download cached GMT remote data from GitHub Artifacts
        run: |
          gh run download -n gmt-cache -D ~/.gmt/static/
          touch ~/.gmt/static/gmt_data_server.txt ~/.gmt/static/gmt_hash_server.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check a few simple commands
        run: bash ci/simple-gmt-tests.sh

      - name: Check a few simple commands (Windows)
        shell: cmd
        run: call ci/simple-gmt-tests.bat
        if: runner.os == 'Windows'

      - name: Debug trend_xy_plot (DO NOT MERGE)
        run: |
          # Disable MinGW's path conversion, see #1035.
          if [ "$RUNNER_OS" == "Windows" ]; then export MSYS_NO_PATHCONV=1; fi
          mkdir dbg && cd dbg
          echo "=== classic mode"
          gmt grdmath -R-1.2/1.2/-0.2/0.2 -I0.4 -r 0.5 X ADD X X MUL ADD X 3 POW ADD = data.grd || true
          gmt grdinfo -C data.grd -V || true
          gmt grdtrend data.grd -N4+x -Ttrend.grd -V || true
          echo "=== modern mode, as in the test"
          export GMT_SESSION_NAME=$$
          gmt begin dbg_modern ps || true
          gmt grdmath -R-1.2/1.2/-0.2/0.2 -I0.4 -r 0.5 X ADD X X MUL ADD X 3 POW ADD = data_m.grd || true
          gmt grdtrend data_m.grd -N4+x -Ttrend_m.grd -V || true
          gmt end || true
          cd ../build
          ctest -R trend_xy_plot --output-on-failure --force-new-ctest-process || true

      - name: Upload build directory if failed
        uses: actions/upload-artifact@v7
        with:
          name: BuildDirectory-${{ runner.os }}
          path: |
            build/
            dbg/
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: false
        if: always()

  # Twin of "test" - see build-skip in build.yml.
  test-skip:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.relevant != 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-slim
    strategy:
      matrix:
        include:
          - name: Linux
          - name: macOS
          - name: Windows
    steps:
      - name: No-op (no relevant changes)
        run: echo "Skipping - no changes relevant to this workflow"
