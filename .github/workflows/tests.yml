#
# Run full tests
#
name: Tests

on:
  push:
    branches:
      - master
      - 6.[0-9]+
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # default to use bash shell
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-slim
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # paths-filter needs a checkout for push events; on PRs it uses the API
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'src/**'
              - 'test/**'
              - 'doc/examples/**'
              - 'doc/scripts/**'
              - '.github/workflows/tests.yml'

  test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    env:
      # directories
      COASTLINEDIR: ${{ github.workspace }}/coastline
      INSTALLDIR: ${{ github.workspace }}/gmt-install-dir
      # disable auto-display of GMT plots
      GMT_END_SHOW: off
      # Run full tests
      BUILD_DOCS  : false
      PACKAGE     : false
      RUN_TESTS   : true

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-14.51
            os: windows-latest
            toolset: ''
          - name: Windows-14.44
            os: windows-latest
            toolset: '14.44'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup vcpkg (Windows)
        run: gh run download -n vcpkg-cache -D C:/vcpkg/installed/
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        if: runner.os == 'macOS'

      - name: Install GMT dependencies
        run: |
          # $RUNNER_OS can be Linux, macOS or Windows
          # The following command converts $RUNNER_OS to lowercase
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          bash ci/install-dependencies-${os}.sh
        env:
          EXCLUDE_OPTIONAL: ${{ matrix.EXCLUDE_OPTIONAL }}

      - name: Add Ghostscript registry so that GraphicsMagick can find it [Windows]
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\Software\GPL Ghostscript"
          New-Item -Path "HKLM:\Software\GPL Ghostscript\10.03.0"
          New-ItemProperty -Path "HKLM:\Software\GPL Ghostscript\10.03.0" -Name GS_DLL -PropertyType String -Value "C:\Miniconda\Library\bin\gsdll64.dll"
          New-ItemProperty -Path "HKLM:\Software\GPL Ghostscript\10.03.0" -Name GS_LIB -PropertyType String -Value "C:\Miniconda\Library\bin;C:\Miniconda\Library\lib;C\Miniconda\Library\Font;C:\Miniconda\Library\fonts"
        if: runner.os == 'Windows'

      - name: Download GSHHG and DCW data
        run: gh run download -n coastline-cache -D coastline
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure GMT
        run: bash ci/config-gmt.sh

      - name: Compile GMT (Linux/macOS)
        run: |
          mkdir build
          cd build
          cmake -G Ninja ..
          cmake --build .
        if: runner.os != 'Windows'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
          toolset: ${{ matrix.toolset }}

      - name: Compile GMT (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DVCPKG_APPLOCAL_DEPS=OFF
          cmake --build .

      - name: Download DVC cache from GitHub Artifacts
        continue-on-error: true
        run: gh run download -n dvc-cache -D .dvc/cache/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pull missing baseline image data from dvc remote
        run: |
          dvc remote modify origin url https://${DAGSHUB_TOKEN}@dagshub.com/GenericMappingTools/gmt.dvc --local
          dvc pull --remote origin --no-run-cache --force || dvc checkout --force
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

      - name: Install GMT
        run: |
          cd build
          cmake --build . --target install
          # Add GMT PATH to bin
          echo "${INSTALLDIR}/bin" >> $GITHUB_PATH

      - name: Download cached GMT remote data from GitHub Artifacts
        run: |
          gh run download -n gmt-cache -D ~/.gmt/static/
          touch ~/.gmt/static/gmt_data_server.txt ~/.gmt/static/gmt_hash_server.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check a few simple commands
        run: bash ci/simple-gmt-tests.sh

      - name: Check a few simple commands (Windows)
        shell: cmd
        run: call ci/simple-gmt-tests.bat
        if: runner.os == 'Windows'

      - name: Debug, assembly of gmt_nc.c for a compiler report (DO NOT MERGE)
        run: |
          # Disable MinGW's path conversion, see #1035.
          export MSYS_NO_PATHCONV=1
          mkdir -p dbg
          echo "VCToolsVersion=$VCToolsVersion"
          cmd /c "cl 2>&1" | head -2 || true
          cd build
          python - <<'PYEOF'
          import subprocess, re, os
          src = os.path.join('..', 'src', 'gmt_nc.c')
          lines = subprocess.run(['ninja', '-t', 'commands', 'src/CMakeFiles/gmtlib.dir/gmt_nc.c.obj'],
                                 capture_output=True, text=True).stdout.strip().splitlines()
          cmd = lines[-1]
          print("COMPILE COMMAND:", cmd)
          text = open(src).read()
          start = text.index('GMT_LOCAL int gmtnc_grd_info (struct GMT_CTRL *GMT')
          end = text.index('\n}\n', start) + 3
          off = '#ifdef _MSC_VER\n#pragma optimize("", off)\n#endif\n'
          on = '#ifdef _MSC_VER\n#pragma optimize("", on)\n#endif\n'
          pragma_src = os.path.join('..', 'src', 'gmt_nc_pragma_dbg.c')
          open(pragma_src, 'w').write(text[:start] + off + text[start:end] + on + text[end:])
          def variant(name, fix, srcfile):
              c = re.sub(r'/Fo\S+', lambda m: '/Fo..\\dbg\\%s.obj' % name, cmd)
              c = re.sub(r'/Fd\S+', '', c)
              c = c.replace('/showIncludes', '')
              c = fix(c)
              if srcfile != src:
                  c = re.sub(r'\S*gmt_nc\.c\s*$', lambda m: os.path.abspath(srcfile), c)
              c += ' /FAs /Fa..\\dbg\\%s.asm' % name
              print("VARIANT", name, ":", c)
              r = subprocess.run(c, shell=True)
              print("VARIANT", name, "exit", r.returncode)
          variant('O2', lambda c: c, src)
          variant('Od', lambda c: c.replace('/O2', '/Od').replace('/Ob2', ''), src)
          variant('O2_pragma', lambda c: c, pragma_src)
          os.remove(pragma_src)
          PYEOF
          cd ..
          ls -l dbg
          for f in dbg/*.asm; do echo "$f: $(wc -l < $f) lines, actual_range refs: $(grep -c 'actual_range' $f)"; done

      - name: Upload assembly
        uses: actions/upload-artifact@v7
        with:
          name: asm-${{ matrix.name }}
          path: dbg/
        if: always()

      - name: Run DOS batch examples (Windows)
        shell: cmd
        run: |
          cd doc/examples
          call do_examples.bat
        if: runner.os == 'Windows'

      - name: Upload build directory if failed
        uses: actions/upload-artifact@v7
        with:
          name: BuildDirectory-${{ runner.os }}
          path: build/
        if: failure()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: false
        if: always()

  # Twin of "test" - see build-skip in build.yml.
  test-skip:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.relevant != 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-slim
    strategy:
      matrix:
        include:
          - name: Linux
          - name: macOS
          - name: Windows
    steps:
      - name: No-op (no relevant changes)
        run: echo "Skipping - no changes relevant to this workflow"
