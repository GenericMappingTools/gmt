#
# DEBUG ONLY, DO NOT MERGE: reduced reproducer for an MSVC 14.51 /O2 miscompilation (see msvc_repro/)
#
name: Tests

on:
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc-14.51
            toolset: ''
          - name: msvc-14.44
            toolset: '14.44'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup MSVC (Windows)
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
          toolset: ${{ matrix.toolset }}

      - name: Build and run the reproducer
        shell: cmd
        run: |
          cd msvc_repro
          cl 2>&1 | findstr /i "Version"
          echo VCToolsVersion=%VCToolsVersion%
          echo ===== /O2 (as in the GMT CI)
          mkdir O2
          cl /nologo /O2 /FAs /FaO2\ /FoO2\ /FeO2\repro.exe repro.c get.c
          O2\repro.exe
          if errorlevel 1 echo O2: wrong result
          echo ===== /O1
          mkdir O1
          cl /nologo /O1 /FAs /FaO1\ /FoO1\ /FeO1\repro.exe repro.c get.c
          O1\repro.exe
          if errorlevel 1 echo O1: wrong result
          echo ===== /Od
          mkdir Od
          cl /nologo /Od /FAs /FaOd\ /FoOd\ /FeOd\repro.exe repro.c get.c
          Od\repro.exe
          if errorlevel 1 echo Od: wrong result
          exit /b 0

      - name: Upload assembly
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ matrix.name }}
          path: msvc_repro/
        if: always()
